NAME="Core system"
INFO="Base system, firmware, microcode, btrfs, fish, sudo, micro, manual pages, Terminus console font, home folders"
OPTIONAL=no
PACKAGES=(base mkinitcpio linux-firmware amd-ucode intel-ucode btrfs-progs dosfstools fish sudo micro less man-db man-pages xdg-user-dirs terminus-font)
SERVICES=(systemd-oomd.service fstrim.timer)
# creates the home folders for users added later, at their first desktop login
USER_SERVICES=(xdg-user-dirs.service)
