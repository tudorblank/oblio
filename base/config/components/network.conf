NAME="Network"
INFO="systemd-networkd, systemd-resolved, iwd for Wi-Fi"
OPTIONAL=no
PACKAGES=(iwd)
SERVICES=(systemd-networkd.service systemd-resolved.service systemd-timesyncd.service iwd.service cachyos-iw-set-regdomain.path)
# enabled automatically with systemd-networkd, can stall boot when no cable is plugged in
DISABLE_SERVICES=(systemd-networkd-wait-online.service)
