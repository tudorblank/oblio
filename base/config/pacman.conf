#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 10
DisableDownloadTimeout
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Oblio's own packages, signed (oblio-keyring), built from github.com/tudorblank/oblio
[oblio]
Server = https://github.com/tudorblank/oblio/releases/download/repo

# @CACHYOS_REPOS@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
